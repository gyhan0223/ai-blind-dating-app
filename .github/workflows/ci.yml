# CI gate (#3 · #27 · #13 · #11 · #12)
#   - 서버 순수 로직 selftest (Node, 외부 호출 없음)
#   - migration 파일 버전 중복 검사 + 로컬 Postgres(mock auth 스텁) 에 전체 마이그레이션 + SQL/동시성 테스트 (run_local_check.sh)
#   - 관리자 웹 typecheck + 세션/로그인 제한·계정/MFA/역할 selftest + next build 브라우저 번들 secret 검사 (#27)
#   - **실제 로컬 Supabase**(Supabase CLI 2.117.0: Postgres · GoTrue · PostgREST · Kong) 에 CLI 경로로 migration 적용/이력 검증 +
#     관리자 Auth 통합 테스트(실제 GoTrue TOTP · 어댑터 · 관리자 웹 HTTP/쿠키) — run_supabase_integration.sh (docs/local-supabase-integration.md)
#   - 모바일 typecheck · lint · selftest · SDK 로그 검사 · **release 산출물 검사** (expo export 3플랫폼 → 개발 마커/서버 secret grep)
# 여기서 통과해도 원격 프로젝트의 migration 이력 확인·EAS 네이티브 release 빌드·실기기 검증을 대신하지 않는다 (docs/release-checklist.md).
name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  server-selftests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: server selftests
        run: bash scripts/server-selftests.sh

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: migration version check (중복 번호 → 실패) + 검사기 자체 검증
        run: |
          node supabase/scripts/check-migration-versions.mjs --selfcheck
          node supabase/scripts/check-migration-versions.mjs
      - name: migrations + SQL/concurrency tests (mock auth 스텁 — 실제 GoTrue 는 supabase-integration job)
        run: cd supabase/tests && DB_NAME=ci_check bash run_local_check.sh

  # 실제 로컬 Supabase 스택 (Docker) — 느린 경로. 환경(도커·CLI) 이 없으면 스크립트가 exit 2 로 실패한다 (skip 아님)
  supabase-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: cd apps/admin && npm ci --no-audit --no-fund
      - name: migration history via Supabase CLI + admin auth integration (real GoTrue · admin web HTTP/cookie)
        env:
          # 로컬 스택 값은 스크립트가 `supabase status` 에서 읽는다. 원격 URL/키는 어디에도 두지 않는다
          DO_NOT_TRACK: '1'
        run: bash supabase/tests/run_supabase_integration.sh
      - name: 스택 정리 (실패 시에도)
        if: always()
        run: supabase --workdir .supabase-it stop --no-backup || true

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - name: selftests (세션 토큰·로그인 제한 · 계정/MFA/역할/세션 흐름)
        run: npm run selftest
      - name: browser bundle check — 검사기 자체 검증 후 next build 산출물(.next/static) 에 서버 secret·RPC 흔적 없음 (#27)
        env:
          # 검사용 placeholder — 실제 값이 아니다. 검사기는 이 값과 secret 이름·service_role·JWT 형태·관리자 RPC 이름을 잡는다
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key-value
          SUPABASE_ANON_KEY: ci-placeholder-anon-key
          ADMIN_SESSION_SECRET: ci-placeholder-session-secret-0123456789
        run: |
          npm run bundle:check:selfcheck
          npm run build
          npm run bundle:check

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      # 검사용 공개 값(placeholder). 서버 secret 은 CI 에 두지 않는다 — 검사기는 secret 이름·service_role 토큰·개발 마커를 잡는다
      EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-public-anon-key-placeholder
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx expo lint
      - name: selftests
        run: |
          npm run devtools:selftest
          npm run face:selftest
          npm run onboarding:selftest
          npm run chat:selftest
          npm run redact:selftest
          npm run preferences:selftest
          node --experimental-strip-types scripts/otp-cooldown-selftest.mjs
          npm run sdk:verify-no-token-log
      - name: release bundle check — 검사기 자체 검증 (가짜 secret 을 잡는지)
        run: npm run release:check:selfcheck
      - name: release bundle check — expo export (web · ios · android) 산출물 grep
        run: npm run release:check
